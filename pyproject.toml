[project]
name = "macropadd"
version = "0.1.0"
description = "MacroPad daemon, lite: only AGENTS mode (Claude Code / Codex sessions on the pad)"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
macropadd = "macropadd.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macropadd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
